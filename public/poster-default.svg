    </g>
  </g>

  <text x="200" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#c7cbd4">
    Pas d'affiche
  </text>
  <text x="200" y="428" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8890a0">
    disponible
